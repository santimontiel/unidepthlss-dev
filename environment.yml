name: unidepth-lss

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - pip:
      # PyTorch stack used by the current VGGT environment (CUDA 12.6 wheels).
      - torch==2.7.0
      - torchvision==0.22.0
      - torchaudio==2.7.0

      # UniDepthLSS and nuScenes evaluation.
      - numpy==1.26.4
      - opencv-python==4.11.0.86
      - Pillow==11.1.0
      - scipy==1.15.2
      - matplotlib==3.5.3
      - nuscenes-devkit==1.1.11
      - pyquaternion==0.9.9
      - tqdm==4.65.2

      # UniDepth/VGGT model dependencies.
      - einops==0.8.1
      - huggingface-hub==0.30.2
      - safetensors==0.5.3
      - timm==1.0.15
      - transformers==4.53.1
      - imageio==2.37.0
      - pandas==2.2.3
      - protobuf==6.33.6
      - tables==3.10.1
      - tabulate==0.9.0
      - trimesh==4.6.6
      - wandb==0.25.1

      # Notebook support.
      - ipykernel==6.29.5
      - ipywidgets==8.1.6
      - jupyterlab==4.4.0

# UniDepth is kept as a separate checkout because the notebooks import it from
# UNIDEPTH_ROOT. By default they expect it beside this repository:
#
#   git clone https://github.com/lpiccinelli-eth/UniDepth.git ../UniDepth
#
# xFormers and torch-scatter are optional; the project has PyTorch fallbacks.
