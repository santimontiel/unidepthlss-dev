[project]
name = "unidepthlss"
version = "1.0"
description = "UniDepth-LSS: depth foundation model priors for camera-only BEV perception"
authors = [
  { name = "Santiago Montiel-Marin" }
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "einops>=0.8.1",
    "huggingface-hub>=0.30.2",
    "hydra-core>=1.3.2",
    "lightning>=2.5.0",
    "matplotlib>=3.10.6",
    "numpy<2.0.0",
    "nuscenes-devkit>=1.1.11",
    "opencv-python>=4.11.0.86",
    "pillow>=11.3.0",
    "pyquaternion>=0.9.9",
    "rich>=13.7.0",
    "rootutils>=1.0.7",
    "safetensors>=0.5.3",
    "scipy>=1.15.3",
    "setuptools>=77",
    "timm>=1.0.21",
    "torch==2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.3",
    "transformers>=4.56.0",
    "unidepth",
    "wandb>=0.21.3",
]

[build-system]
requires = ["setuptools >= 77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["unidepthlss"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu129" },
]
torchvision = [
  { index = "pytorch-cu129" },
]
# The frozen depth backbone. Pinned to an exact commit rather than a branch: the whole point of
# this repo is reproducing a published number, and `UniDepthV2.encode_decode`'s output is the
# single largest input to it. Installed from git rather than vendored into `unidepthlss/ops/`
# because we only call the pretrained model -- there is no adapted or modified upstream code to
# keep diffable, and the optional KNN CUDA extension (evaluation-only, per UniDepth's README) is
# not built or needed.
unidepth = { git = "https://github.com/lpiccinelli-eth/UniDepth.git", rev = "8d8cfe4c7ee15297099983607febf0d4f32eb3d6" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pyyaml>=6.0",
]

[tool.uv]
# UniDepth's requirements.txt is a loose superset of what UniDepthV2 actually needs, and one of
# its pins is incompatible with the rest of this stack. Each override below is deliberate:
#
#   numpy      UniDepth declares `numpy>=2.0.0`; nuscenes-devkit needs `<2`. The authors of
#              UniDepth-LSS shipped `numpy==1.26.4` in their own environment.yml and produced
#              the released checkpoint with it, so `<2` is the *validated* combination here --
#              this bypasses a stale upper-bound-free pin rather than downgrading anything.
#   xformers   Imported only under `try/except ImportError` (unidepth/layers/nystrom_attention.py,
#              models/backbones/metadinov2/*), and only on the UniDepth *v1* path. The reference
#              evaluation log for this repo prints "xFormers not available" and still produced
#              49.4 IoU, so excluding it reproduces the authors' actual environment.
#   torchaudio Never imported anywhere in the `unidepth` package; pulling it in would add a
#              second torch-version constraint against the pinned cu129 wheel for no benefit.
#   gradio     Never imported anywhere in the `unidepth` package (demo tooling only).
#
# The impossible `python_version < "3.0"` marker is uv's idiom for "resolve this requirement
# away" -- it is never satisfiable, so the package is simply not installed.
override-dependencies = [
    "numpy<2.0.0",
    "xformers; python_version < '3.0'",
    "torchaudio; python_version < '3.0'",
    "gradio; python_version < '3.0'",
]
